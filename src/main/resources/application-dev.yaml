spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/thyrsio}
    username: ${POSTGRES_USER:thyrsio_user}
    password: ${POSTGRES_PASSWORD:thyrsio_pass}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

server:
  port: 8080